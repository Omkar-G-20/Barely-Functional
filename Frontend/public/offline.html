<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AgriFeed – Offline</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1b5e20 0%, #2e7d32 60%, #388e3c 100%);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #fff;
      padding: 2rem;
    }
    .card {
      background: rgba(255,255,255,0.10);
      border: 1px solid rgba(255,255,255,0.20);
      backdrop-filter: blur(16px);
      border-radius: 24px;
      padding: 3rem 2.5rem;
      text-align: center;
      max-width: 420px;
      width: 100%;
    }
    .icon {
      font-size: 4rem;
      margin-bottom: 1.5rem;
      display: block;
    }
    h1 { font-size: 1.7rem; font-weight: 700; margin-bottom: 0.8rem; }
    p  { font-size: 1rem; opacity: 0.85; line-height: 1.6; margin-bottom: 2rem; }
    .btn {
      display: inline-block;
      background: #4caf50;
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 0.8rem 2rem;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.2s;
    }
    .btn:hover { background: #388e3c; }
    .tip {
      margin-top: 2rem;
      font-size: 0.82rem;
      opacity: 0.65;
    }
  </style>
</head>
<body>
  <div class="card">
    <span class="icon">🌿</span>
    <h1>You are Offline</h1>
    <p>
      AgriFeed needs an internet connection for new analyses.<br/>
      Your past test history and reports are available below.
    </p>
    <a href="/" class="btn">Go to Saved Data</a>
    <p class="tip">
      Once back online, all your queued submissions will sync automatically.
    </p>
  </div>
</body>
</html>
